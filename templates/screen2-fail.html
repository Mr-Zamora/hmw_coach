<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genuine Need — 3×3 HMW Coach</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <header class="app-header">
    <span class="app-logo">HMW Coach</span>
    <span class="step-label">Step 2 of 5</span>
  </header>

  <div class="progress-dots">
    <div class="dot done"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="card">
    <div class="persona-chip">🎮 The Gamer</div>

    <h2>What's the specific moment things get hard?</h2>

    <textarea>He needs more desk space for his controllers and headset but there's nowhere to put them.</textarea>

    <div class="feedback-box fail" style="margin-top:14px">
      <span class="feedback-icon">⚠️</span>
      <div class="feedback-body">
        <div class="feedback-label">Needs work</div>
        <div class="feedback-text">This would be the same problem in any home — storage isn't unique to a 9 m² space. Try to name the moment another zone (sleeping, cooking, bathing) actually gets in the way.</div>
      </div>
    </div>

    <div class="attempt-counter">
      <div class="attempt-pips">
        <div class="pip used"></div>
        <div class="pip used"></div>
        <div class="pip"></div>
      </div>
      <span>Attempt 2 of 3</span>
    </div>

    <button class="btn btn-primary">Try again →</button>
  </div>

</body>
</html>
