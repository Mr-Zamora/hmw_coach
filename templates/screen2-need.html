<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genuine Need — 3×3 HMW Coach</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <header class="app-header">
    <span class="app-logo">HMW Coach</span>
    <span class="step-label">Step 2 of 5</span>
  </header>

  <div class="progress-dots">
    <div class="dot done"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div class="card">
    <div class="persona-chip">🎮 The Gamer</div>

    <h2>What's the specific moment things get hard?</h2>
    <p class="subtitle">Describe one moment when your persona's session is interrupted by another zone in the room.</p>

    <textarea placeholder="e.g. When they're mid-session and need to cook, steam from the kitchen drifts directly over their open equipment because..."></textarea>
    <div class="char-hint">Be specific — name which zone gets in the way</div>

    <button class="btn btn-primary" style="margin-top:16px">Check my answer →</button>
  </div>

</body>
</html>
