<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start — 3×3 HMW Coach</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <div class="card card-start">
    <span class="card-icon">📐</span>
    <div class="card-tag">3×3 Living Space Challenge</div>
    <h1>HMW Coach</h1>
    <p class="subtitle">One space. Four zones. One design problem that's yours.</p>

    <div class="form-group" style="text-align:left">
      <label for="name">Your name</label>
      <input type="text" id="name" placeholder="e.g. Jordan Smith">
    </div>

    <div class="form-group" style="text-align:left">
      <label for="cls">Class</label>
      <input type="text" id="cls" placeholder="e.g. 10DT-A">
    </div>

    <button class="btn btn-primary">Start →</button>

    <div class="divider"></div>

    <a href="#" class="continue-link">↩ Continue where I left off</a>
  </div>

</body>
</html>
